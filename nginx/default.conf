upstream python_web {
    server python:8000 ;
}
server_tokens off ;
server {
    listen 8080 default_server ;
    listen [::]:8080 default_server;
    server_name _ ;

    location / {
        proxy_set_header Host $host ;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for ;
        proxy_pass http://python:8000 ;
    }
    location /grafana/ {
        proxy_set_header Host $host ;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for ;
        proxy_pass http://grafana:3000 ;
    }
    # This can lead to unauthenticated access to the Prometheus Write API:
    #location /prometheus/ {
    #    proxy_set_header Host $host ;
    #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for ;
    #    proxy_pass http://prometheus:9090;
    #}
    # This can lead to unauthenticated access to the Alloy Debug UI:
    #location /alloy/ {
    #    proxy_set_header Host $host ;
    #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for ;
    #    proxy_pass http://alloy:12345 ;
    #}


    location /static/ {
        # contains a directory named "static":
        root /var/www/web/ ;
    }
}
